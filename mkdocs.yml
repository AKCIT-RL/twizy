site_name: AIR Twizy Hardware
site_description: Documentation for the AIR-UFG Twizy hardware stack — camera, LiDAR and vehicle interface
site_url: https://akcit-rl.github.io/twizy/
repo_url: https://github.com/AKCIT-RL/twizy
repo_name: AKCIT-RL/twizy
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Networking:
      - Overview: networking/index.md
      - NetBird VPN: networking/netbird.md
      - Discovery Server: networking/discovery-server.md
  - Teleoperation:
      - Web Dashboard: teleoperation/dashboard.md
      - Xbox / DDS: teleoperation/index.md
      - Xbox Controller: teleoperation/xbox-controller.md
  - Sensors: sensors.md
  - Camera (Lucid Vision):
      - Overview: camera/index.md
      - Parameters: camera/parameters.md
      - Streaming: camera/streaming.md
      - Recording: camera/recording.md
  - LiDAR (Ouster): lidar/index.md
  - Vehicle:
      - Safety: vehicle/safety.md
      - Powering Up: vehicle/startup.md
      - Overview: vehicle/index.md
      - Automatic Startup: vehicle/autostart.md
      - Operation: vehicle/operation.md
      - Vehicle Interface: vehicle/interface.md
  - Hardware:
      - Overview: hardware/index.md
      - Sensors: hardware/sensors.md
  - Configuration: configuration.md
  - Status & Roadmap: roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AIR-UFG
